name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:install
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t tumblr-vault:test .
      - run: |
          docker run -d --name vault-test -p 127.0.0.1:4318:4318 tumblr-vault:test --demo
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:4318/health; then exit 0; fi
            sleep 2
          done
          docker logs vault-test
          exit 1
      - if: always()
        run: docker rm -f -v vault-test || true
